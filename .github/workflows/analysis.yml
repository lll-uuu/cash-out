name: Cash Out analysis

on:
  schedule:
    # Once a day, at 09:17 UTC (06:17 in Brasília), away from the hourly marbling runs.
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cash-out
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aggregate analysis
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node analyze.js
      - name: Save
        run: |
          git config user.name "cash-out"
          git config user.email "cash-out@users.noreply.github.com"
          git add analysis
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "analysis $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
