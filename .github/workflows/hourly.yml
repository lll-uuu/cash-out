name: Cash Out hourly

on:
  schedule:
    # Every hour on the hour. GitHub often starts these a few minutes late; each frame
    # is filed under the hour it belongs to. The last run is at 20:00 UTC on 25 October (17:00 in Brasília).
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cash-out
  cancel-in-progress: false

jobs:
  marble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Collect odds, trades and anomalies
        run: node collect.js
      - name: Render this hour's frame
        run: node render-frame.js --latest --size 1600 --force
      - name: Save
        run: |
          git config user.name "cash-out"
          git config user.email "cash-out@users.noreply.github.com"
          git add data frames
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "marble $(date -u +%Y-%m-%dT%HZ)"
          git pull --rebase
          git push
